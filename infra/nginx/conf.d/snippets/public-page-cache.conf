# Short cache for anonymous public HTML. Included only from locations that
# re-state security headers, because any add_header here replaces server-level headers.
proxy_cache cardon_pages;
proxy_cache_valid 200 45s;
proxy_cache_lock on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_bypass $cardon_page_cache_bypass $cardon_method_bypass;
proxy_no_cache $cardon_page_cache_bypass $cardon_method_bypass;
proxy_ignore_headers Cache-Control;
include /etc/nginx/conf.d/snippets/security-headers.conf;
add_header X-Cache-Status $upstream_cache_status always;
add_header Cache-Control "public, max-age=30" always;

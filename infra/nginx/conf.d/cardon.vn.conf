# cardon.vn + www.cardon.vn — Customer website + API proxy

server {
  listen 80;
  server_name cardon.vn www.cardon.vn;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name cardon.vn www.cardon.vn;

  ssl_certificate     /etc/nginx/ssl/cardon.vn.pem;
  ssl_certificate_key /etc/nginx/ssl/cardon.vn.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  include /etc/nginx/conf.d/snippets/security-headers.conf;

  location /health {
    proxy_pass http://cardon_api/health;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
  }

  # --- Payment callbacks: NO limit_req (W4 safety matrix) ---
  # SePay docs/examples sometimes use /webhooks/ — alias to canonical /webhook/
  location = /api/v1/payments/webhooks/sepay {
    proxy_pass http://cardon_api/api/v1/payments/webhook/sepay;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
  }

  location ^~ /api/v1/payments/webhook/ {
    proxy_pass http://cardon_api/api/v1/payments/webhook/;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
  }

  location ^~ /api/v1/payments/ipn/ {
    proxy_pass http://cardon_api/api/v1/payments/ipn/;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
  }

  # --- Auth abuse paths: nginx defense-in-depth (CGNAT-friendly burst) ---
  location ~ ^/api/v1/auth/(register|agent-register)$ {
    limit_req zone=cardon_auth burst=10 nodelay;
    proxy_pass http://cardon_api;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
  }

  location ~ ^/api/v1/auth/login$ {
    limit_req zone=cardon_auth burst=20 nodelay;
    proxy_pass http://cardon_api;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
  }

  # General API — no limit_req (orders / checkout / webhooks already exact-matched above)
  location /api/ {
    proxy_pass http://cardon_api/api/;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
  }

  include /etc/nginx/conf.d/snippets/uploads-proxy.conf;

  # Long-cache hashed Next assets + public images (PageSpeed "efficient cache lifetimes")
  location ^~ /_next/static/ {
    proxy_pass http://cardon_web;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ^~ /images/ {
    proxy_pass http://cardon_web;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
  }

  location = / {
    proxy_pass http://cardon_web;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
    include /etc/nginx/conf.d/snippets/public-page-cache.conf;
  }

  location = /the-game {
    proxy_pass http://cardon_web;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
    include /etc/nginx/conf.d/snippets/public-page-cache.conf;
  }

  location = /the-dien-thoai {
    proxy_pass http://cardon_web;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
    include /etc/nginx/conf.d/snippets/public-page-cache.conf;
  }

  location = /nap-cuoc {
    proxy_pass http://cardon_web;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
    include /etc/nginx/conf.d/snippets/public-page-cache.conf;
  }

  location = /nap-data {
    proxy_pass http://cardon_web;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
    include /etc/nginx/conf.d/snippets/public-page-cache.conf;
  }

  location / {
    proxy_pass http://cardon_web;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
  }
}

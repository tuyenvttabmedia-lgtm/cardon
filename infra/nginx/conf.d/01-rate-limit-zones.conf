# W4 S3 — path-scoped rate limit zones (http context via conf.d include).
# Keys use $binary_remote_addr AFTER Cloudflare real_ip (see 00-cloudflare-real-ip.conf).
# Do NOT attach these zones to webhook/IPN/health/partner catch-alls.

limit_req_zone $binary_remote_addr zone=cardon_auth:10m rate=5r/m;
limit_req_status 429;

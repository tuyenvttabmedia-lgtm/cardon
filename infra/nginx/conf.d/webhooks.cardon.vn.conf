# webhooks.cardon.vn — DNS-only partner inbound (Airalo, …)
# Keep this vhost in git: `git reset --hard` on VPS must not drop it.
# TLS: dedicated LE cert at webhooks.cardon.vn.{pem,key} (or symlink from wildcard).

server {
  listen 80;
  server_name webhooks.cardon.vn;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name webhooks.cardon.vn;

  ssl_certificate     /etc/nginx/ssl/webhooks.cardon.vn.pem;
  ssl_certificate_key /etc/nginx/ssl/webhooks.cardon.vn.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  include /etc/nginx/conf.d/snippets/security-headers.conf;

  # Partner probes (Airalo HEAD/GET) — fail fast, no keepalive pile-up
  keepalive_timeout 5s;
  client_body_timeout 15s;
  send_timeout 15s;

  location = /health {
    proxy_pass http://cardon_api/health;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
  }

  # Do not redeclare proxy_*_timeout here — already set in proxy-headers.conf
  location ^~ /api/v1/webhooks/ {
    proxy_pass http://cardon_api/api/v1/webhooks/;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
    add_header Connection close always;
  }

  # Everything else on this host is intentional 404 (no customer UI)
  location / {
    default_type application/json;
    return 404 '{"success":false,"error":{"message":"Not found"}}';
  }
}

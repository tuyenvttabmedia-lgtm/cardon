# Local-only listener for the SePay eSIM sandbox IPN.
# Published on the host as 127.0.0.1:8081. Does not serve the website.

map $http_x_secret_key $esim_ipn_secret_present {
  default 1;
  "" 0;
}

log_format esim_ipn '$remote_addr [$time_local] "$request_method $uri" '
                    'status=$status bytes=$body_bytes_sent '
                    'req_len=$request_length cl=$content_length '
                    'ct="$content_type" secret_present=$esim_ipn_secret_present';

server {
  listen 8081;
  server_name ipn-sandbox.cardon.vn;

  access_log /var/log/nginx/esim-ipn.access.log esim_ipn;
  error_log /var/log/nginx/esim-ipn.error.log warn;

  location = /api/v1/payments/ipn/esim/sepay {
    if ($request_method != POST) {
      return 405;
    }

    proxy_pass http://cardon_api/api/v1/payments/ipn/esim/sepay;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;
    proxy_pass_request_headers on;
    proxy_pass_request_body on;
  }

  location / {
    default_type text/plain;
    return 404;
  }
}
